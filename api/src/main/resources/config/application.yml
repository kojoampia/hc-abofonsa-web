spring:
  application.name: abofonsa-bridgecare-api
  threads.virtual.enabled: true # Java 25 virtual threads for request handling — see spec §7.2
  # Boot 4.1 split Mongo config: connection properties (uri/host/port/credentials) moved to the
  # new top-level `spring.mongodb.*` namespace; `spring.data.mongodb.*` now only carries Spring
  # Data-specific behaviour (auto-index-creation, field naming, GridFS). The spec (written against
  # the Boot 3.x property layout) has both under `spring.data.mongodb.*` — corrected here to match
  # what 4.1.0 actually reads.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27018/abofonsa}
  data.mongodb:
    auto-index-creation: false # indexes are created by the migration runner, not at runtime
  jackson:
    default-property-inclusion: non_null
    deserialization.fail-on-unknown-properties: true

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  health.readiness-state.enabled: true
  health.liveness-state.enabled: true

abofonsa:
  locales.supported: en,es,fr,de
  locales.default: en
  cache.published-content-ttl: PT10M
  security:
    jwt:
      issuer: https://www.abofonsa.com
      # HS512 (hc-admin-gw convention) needs >= 64 bytes of key material; no insecure default in
      # prod — see infra/prod-server/.env (Phase 20). This dev-only default is fine for local use.
      signing-key: ${JWT_SIGNING_KEY:dev-only-signing-key-for-hs512-must-be-at-least-64-bytes-long-0000000000000000}
      access-token-ttl: PT30M
      refresh-token-ttl: P14D
  enquiry:
    rate-limit.per-hour-per-ip: 5
    # Salts the SHA-256 of the sender's IP before storage (spec §8.2/§13.3 — raw IPs are never
    # persisted). Override in production; the default is fine for dev only.
    ip-salt: ${ENQUIRY_IP_SALT:dev-only-ip-salt}
    retention-months: 24 # spec §13.3; confirm-or-change checkpoint in plan.md Phase 21
    min-dwell-ms: 3000 # submissions faster than this are treated as bot traffic (spec §7.7)
  admin:
    bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  media:
    # Binaries live on the filesystem behind nginx, not in MongoDB (spec §8.2/§14.2 #6).
    storage-path: ${MEDIA_STORAGE_PATH:./target/media-storage}

spring.servlet.multipart:
  max-file-size: 8MB # spec §7.7 upload cap; also enforced in MediaService by byte count
  max-request-size: 9MB
