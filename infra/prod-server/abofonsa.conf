# Deployed as /etc/nginx/sites-available/abofonsa.conf on webserver, symlinked into
# sites-enabled. Named after the app (matching ndua.conf / bedrock.conf / hc-crowdfunding.conf),
# not the literal domain.
#
# This is the pre-Certbot bootstrap version — HTTP only. Once DNS points here and this file is
# enabled, run:
#
#   certbot --nginx -d web.abofonsa.com
#
# which rewrites this file in place, adding the TLS server block and the HTTP->HTTPS redirect,
# exactly as it has for every other conf in sites-enabled. Do not hand-write the TLS block;
# certbot's rewrite is what keeps renewal working.
#
# Only `web.abofonsa.com` is served. The apex (`abofonsa.com`) is deliberately NOT claimed here:
# it is a separate hostname that may already serve, or later serve, something else, and a server
# block here would silently take it over for anything resolving to this host. If the apex should
# point at this site, that is a decision to make explicitly, and then both the server_name and the
# certbot command below need it.

server {
    listen 80;
    listen [::]:80;
    server_name web.abofonsa.com;

    # THROTTLE STATUS: this site returns 429 for a rate-limited request, and that value is NOT set
    # here. It comes from /etc/nginx/conf.d/00-host-throttle-status.conf, a HOST-owned file shipped
    # from the hc-admin repository (hc-admin backlog items 98 and 105). nginx applies an http-scope
    # `limit_req_status` to every server on the box, so this site inherits it without declaring it.
    #
    # ⛔ DO NOT ADD `limit_req_status` AT http SCOPE ANYWHERE — not in this file above the server
    # block, and not in a conf.d file of our own. A second http-scope declaration is NOT an override,
    # it is fatal: nginx rejects THE WHOLE CONFIGURATION with
    #     nginx: [emerg] "limit_req_status" directive is duplicate in …
    # and `nginx -t` covers the entire server, so one file takes the config test down for EVERY site
    # on this host, not just ours. hc-patient did exactly this on 2026-08-05 and their configuration
    # was unshippable until 2026-08-11 — under an error naming hc-admin's file, never their own.
    #
    # To use a different status for THIS site only, put `limit_req_status <code>;` inside this
    # `server { }` block (or a `location { }`). That is legal, it wins over the host file, and it
    # produces no duplicate. Three sibling products already do exactly that.

    # Uploaded images can be several megabytes before the API's own 8 MB cap rejects them; the
    # default 1 MB would fail CMS uploads at the proxy with an opaque 413.
    client_max_body_size 10m;

    # Compression. nginx.conf sets `gzip on` globally but leaves `gzip_types` commented out, so the
    # default applies and only text/html is compressed — which is why this site was shipping ~845 kB
    # of uncompressed JavaScript to an audience the spec explicitly describes as being on mid-range
    # Android over a slow connection (§13.1). Both settings below are load-bearing:
    #
    #   gzip_types    — the SSR server labels bundles `text/javascript`, so listing only
    #                   `application/javascript` would silently miss every one of them.
    #   gzip_proxied  — this content all arrives via proxy_pass, and nginx does not compress
    #                   proxied responses unless told to.
    #
    # Per-server rather than global, matching how jojoaddison.conf on this host does it.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # The SSR container serves the site and proxies /api and /media to the API itself, so nginx
    # needs exactly one location. Keeping the fan-out inside the app means the same relative URLs
    # work in `ng serve`, local compose and here.
    location / {
        proxy_pass                          http://127.0.0.1:8082;
        proxy_http_version                  1.1;
        proxy_set_header  Host              $http_host;
        proxy_set_header  X-Real-IP         $remote_addr;
        # The API derives its per-IP enquiry rate limit from X-Forwarded-For; without this every
        # visitor would look like the proxy and share one bucket, so the fifth enquiry from
        # anybody would start returning 429 to everybody.
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        # Angular SSR validates this against its ALLOWED_HOSTS list, and derives the canonical and
        # hreflang URLs from it — a wrong value here points every canonical at the wrong origin.
        proxy_set_header  X-Forwarded-Host  $http_host;
        proxy_read_timeout                  60s;
    }

    # Hashed filenames are immutable, so let nginx answer repeat visits without waking Node.
    # The HTML itself is deliberately not cached here — publishing must be visible immediately
    # (the SSR server sets Cache-Control: no-cache on it for the same reason).
    location ~* \.(?:js|css|woff2?|svg|ico)$ {
        proxy_pass                          http://127.0.0.1:8082;
        proxy_set_header  Host              $http_host;
        proxy_cache_valid                   200 1y;
        add_header        Cache-Control     "public, max-age=31536000, immutable";
    }

    # /actuator is not proxied at all. Metrics and health are for the monitoring network, and the
    # SSR container does not forward them either — this is a second, independent reason they never
    # become publicly reachable.

    access_log /var/log/nginx/abofonsa.access.log;
    error_log  /var/log/nginx/abofonsa.error.log;
}
