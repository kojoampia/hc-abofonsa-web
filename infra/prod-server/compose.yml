# Deployed as ~/webroot/01-healthconnect/abofonsa/compose.yml on webserver, following that host's
# per-app convention (see ../PRODUCTION_DEPLOYMENT_PLAN.md and the sibling hc-crowdfund-app): a
# dedicated external network, loopback-only published ports because host nginx owns TLS and public
# routing, and container names prefixed to match this app.
#
# `name:` is pinned explicitly so `docker compose up -d --remove-orphans` (see ./start) can only
# ever affect this project's containers — relying on the directory-derived default once cost the
# sibling app an unrelated container that happened to share the name.
name: hc-abofonsa

services:
  mongo:
    image: mongo:8.3
    container_name: abofonsa-mongodb
    restart: unless-stopped
    # A replica set even with one member: publishing content uses multi-document transactions, and
    # MongoDB only offers those on a replica set. `mongo-init` below performs the one-time
    # rs.initiate(); this flag alone does not.
    # --auth added 2026-08-02. Until then this database required NO credentials and any
    # container on abofonsanet had full read/write. --keyFile is mandatory alongside it:
    # a replica set authenticates its own members, even a single-member one, and mongod
    # refuses to start with --auth on a replSet without it.
    command: ["--replSet", "rs0", "--bind_ip_all", "--auth", "--keyFile", "/etc/mongo-keyfile"]
    environment:
      # Only consulted when /data/db is empty. On an existing volume these are ignored entirely.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env (openssl rand -hex 24)}
    networks:
      - abofonsanet
    volumes:
      - mongo-data:/data/db
      # Mode 400, owned by uid 999 (the image's mongodb user). Root-owned or group-readable and
      # mongod exits at startup complaining the permissions are too open.
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    # Deliberately publishes no port. Nothing outside this network has any business reaching the
    # database, and the backup script reaches it with `docker exec`.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongo-init:
    image: mongo:8.3
    container_name: abofonsa-mongodb-init
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - abofonsanet
    restart: "no"
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
      MONGO_MONITOR_USERNAME: ${MONGO_MONITOR_USERNAME:?Set MONGO_MONITOR_USERNAME in .env}
      MONGO_MONITOR_PASSWORD: ${MONGO_MONITOR_PASSWORD:?Set MONGO_MONITOR_PASSWORD in .env}
    volumes:
      - ./mongo-init.js:/init.js:ro
    # The logic moved to mongo-init.js: it is too long for a readable inline --eval now that it
    # also provisions users. Idempotent - safe to re-run on every stack start.
    entrypoint:
      - mongosh
      - --host
      - mongo:27017
      - -u
      - ${MONGO_ROOT_USERNAME}
      - -p
      - ${MONGO_ROOT_PASSWORD}
      - --authenticationDatabase
      - admin
      - --quiet
      - --file
      - /init.js

  api:
    image: ${REGISTRY:-docker.jojoaddison.net}/abofonsa-api:${TAG:-latest}
    container_name: abofonsa-api
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    networks:
      - abofonsanet
      # External, shared with the rest of this server's apps (~/webroot/00-admin/monitoring) —
      # lets the API reach the OTel collector and lets Prometheus scrape /actuator/prometheus.
      - monitoring
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/abofonsa?replicaSet=rs0&authSource=admin
      # Fail fast and loudly rather than booting with a dev default: HS512 needs >= 64 bytes,
      # generate with `openssl rand -base64 64`.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (openssl rand -base64 64)}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      # Salts the per-IP hash behind enquiry rate limiting. Changing it resets every counter, and
      # a predictable value would let the stored hashes be reversed to visitor IPs.
      ENQUIRY_IP_SALT: ${ENQUIRY_IP_SALT:?Set ENQUIRY_IP_SALT in .env (openssl rand -base64 32)}
      MEDIA_STORAGE_PATH: /app/media-storage
      # OpenTelemetry agent, inert until named here — so this is the only deployment that pays its
      # startup cost.
      #
      # THE AGENT COMES FROM ./agent, NOT FROM THE IMAGE. This deployment has been nominally
      # instrumented for months while producing NO traces and NO request metrics, because the
      # v2.9.0 jar baked into the image predates Java 25 and this image is `temurin:25-jre-alpine`.
      # On that runtime the agent loads, logs its version banner, exports JVM metrics — those come
      # from runtime MBeans and need no bytecode rewriting — and rewrites not one application class.
      # Nothing is logged at any level when it fails. The symptom was that `hc-abofonsa-api` had JVM
      # panels full of data in Grafana while being absent from Tempo's service list entirely.
      #
      # api/Dockerfile now pins v2.30.0, so once the image has been rebuilt from it this mount, the
      # `agent/` directory, the fetch in infra.sh and the guard in `start` can all be deleted and
      # the path below goes back to /app/otel-javaagent.jar. Confirm the rebuild first:
      #   docker exec abofonsa-api unzip -p /app/otel-javaagent.jar META-INF/MANIFEST.MF \
      #     | grep Implementation-Version
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseZGC -javaagent:/opt/otel-javaagent.jar"
      OTEL_SERVICE_NAME: hc-abofonsa-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production
    volumes:
      # Uploaded images must outlive the container — this is the only durable state outside Mongo.
      - media-data:/app/media-storage
      # Read-only, and outside /app so it cannot be confused with the image's own stale copy.
      - ./agent/otel-javaagent.jar:/opt/otel-javaagent.jar:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      # Wide, because the OTel agent's bytecode instrumentation adds real boot latency on this
      # single-core host — the sibling app measured minutes, not seconds, under load.
      start_period: 120s

  web:
    image: ${REGISTRY:-docker.jojoaddison.net}/abofonsa-web:${TAG:-latest}
    container_name: abofonsa-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - abofonsanet
    environment:
      # SSR runs in Node, where fetch has no origin, so the API base must be absolute.
      API_URL: http://api:8080
      # Angular 22's SSR rejects any Host it was not told to expect (its SSRF defence). These are
      # the names this site is legitimately served under; nginx forwards the real one.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-web.abofonsa.com}
      # Search-engine indexing is opt-in. Unset or anything but "true" serves
      # noindex + a disallow-all robots.txt — see web/src/app/core/seo/indexable.ts.
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      PORT: "4000"
    ports:
      # Loopback only — host nginx (Certbot-managed TLS) is the sole thing on a public interface,
      # matching every other app on this server.
      - "127.0.0.1:${FRONTEND_PORT:-8082}:4000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  abofonsanet:
    external: true
  monitoring:
    external: true

volumes:
  mongo-data:
  media-data:
