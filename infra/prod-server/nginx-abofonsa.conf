# Deployed as /etc/nginx/sites-available/nginx-abofonsa.conf on webserver, symlinked into
# sites-enabled. Named after the app (matching ndua.conf / bedrock.conf / hc-crowdfunding.conf),
# not the literal domain.
#
# This is the pre-Certbot bootstrap version — HTTP only. Once DNS points here and this file is
# enabled, run:
#
#   certbot --nginx -d www.abofonsa.com -d abofonsa.com
#
# which rewrites this file in place, adding the TLS server block and the HTTP->HTTPS redirect,
# exactly as it has for every other conf in sites-enabled. Do not hand-write the TLS block;
# certbot's rewrite is what keeps renewal working.

# Apex redirects to www so there is one canonical origin. Two hostnames serving identical content
# splits SEO signals and makes the hreflang alternates (which name www) inconsistent.
server {
    listen 80;
    listen [::]:80;
    server_name abofonsa.com;
    return 301 http://www.abofonsa.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.abofonsa.com;

    # Uploaded images can be several megabytes before the API's own 8 MB cap rejects them; the
    # default 1 MB would fail CMS uploads at the proxy with an opaque 413.
    client_max_body_size 10m;

    # The SSR container serves the site and proxies /api and /media to the API itself, so nginx
    # needs exactly one location. Keeping the fan-out inside the app means the same relative URLs
    # work in `ng serve`, local compose and here.
    location / {
        proxy_pass                          http://127.0.0.1:8082;
        proxy_http_version                  1.1;
        proxy_set_header  Host              $http_host;
        proxy_set_header  X-Real-IP         $remote_addr;
        # The API derives its per-IP enquiry rate limit from X-Forwarded-For; without this every
        # visitor would look like the proxy and share one bucket, so the fifth enquiry from
        # anybody would start returning 429 to everybody.
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        # Angular SSR validates this against its ALLOWED_HOSTS list.
        proxy_set_header  X-Forwarded-Host  $http_host;
        proxy_read_timeout                  60s;
    }

    # Hashed filenames are immutable, so let nginx answer repeat visits without waking Node.
    # The HTML itself is deliberately not cached here — publishing must be visible immediately
    # (the SSR server sets Cache-Control: no-cache on it for the same reason).
    location ~* \.(?:js|css|woff2?|svg|ico)$ {
        proxy_pass                          http://127.0.0.1:8082;
        proxy_set_header  Host              $http_host;
        proxy_cache_valid                   200 1y;
        add_header        Cache-Control     "public, max-age=31536000, immutable";
    }

    # /actuator is not proxied at all. Metrics and health are for the monitoring network, and the
    # SSR container does not forward them either — this is a second, independent reason they never
    # become publicly reachable.

    access_log /var/log/nginx/abofonsa.access.log;
    error_log  /var/log/nginx/abofonsa.error.log;
}
