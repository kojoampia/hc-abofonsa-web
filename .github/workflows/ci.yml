# CI pipeline (plan.md Phase 18, spec §12.2).
#
# Deliberately independent jobs so a failure names its own cause: `backend`, `dependency-check` and
# `frontend` run in parallel on every push and PR, and `e2e` runs the real stack afterwards. That
# isolation is the point of task 106-108's verification — breaking a backend rule must not turn the
# frontend job red, or neither signal means anything.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first one's result irrelevant; don't pay for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: api/pom.xml

      # Testcontainers needs a Docker daemon; ubuntu-latest ships one.
      - name: Unit + integration tests, JaCoCo 80% gate, Spotless
        working-directory: api
        run: ./mvnw -B verify

  dependency-check:
    name: Backend dependency vulnerabilities (CVSS >= 7 fails)
    runs-on: ubuntu-latest
    # Separate from `backend` so a newly published CVE — which appears without a line of code
    # changing — does not mask a genuine test failure, and vice versa.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: api/pom.xml

      # The NVD mirror is expensive to rebuild; cache it and refresh incrementally.
      - name: Cache the NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      - name: OWASP dependency-check
        working-directory: api
        run: ./mvnw -B verify -Psecurity -DskipTests -Dnvd.api.key="${{ secrets.NVD_API_KEY }}"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: api/target/dependency-check-report.*
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, test, i18n, build, budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      # angular.json's coverageThresholds fail this step below the gate.
      - name: Unit tests with coverage
        working-directory: web
        run: npm test -- --watch=false

      - name: i18n key parity across all four locales
        working-directory: web
        run: npm run check-i18n

      - name: Production build
        working-directory: web
        run: npm run build -- --stats-json

      # Spec §13.1: initial JS under 220 kB gzipped, and the CMS must stay out of it.
      - name: Performance budget
        working-directory: web
        run: npm run check-bundle-size

  e2e:
    name: E2E (Playwright against docker compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build and start the full stack
        run: docker compose up -d --build --wait

      # `--wait` already blocks on the healthchecks; this prints *why* a service never became
      # healthy instead of leaving an opaque timeout.
      - name: Stack status
        if: always()
        run: docker compose ps

      # Run inside Playwright's own image rather than on the runner, and pin it to the version in
      # package-lock.json. The browser comes with the image, which is why the separate
      # `playwright install` step is gone — but the fonts are the actual reason.
      #
      # This job had never run to completion: it needs `backend`, which was red for months, so the
      # visual baselines had never once been compared anywhere but a developer's machine. The first
      # green backend let it run, and all twenty visual tests failed — including the ones nobody had
      # touched. Not a regression: `--font-serif` is `Georgia, 'Times New Roman', serif`, neither of
      # which ships on ubuntu-latest, so the runner substituted a different face, every line of text
      # changed width, and whole pages reflowed. The careers page differed by 16% of its pixels
      # against a 1% tolerance; raising the tolerance could not fix a layout shift, and would have
      # blinded the check to the regressions it exists to catch.
      #
      # A container fixes the font set by construction. `npm run e2e:update-snapshots:ci` regenerates
      # baselines through this same image, so what a developer commits is what CI compares against.
      # --network host so localhost:4000 reaches the compose stack published on the runner.
      - name: Run the suite
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/work" -w /work/web \
            mcr.microsoft.com/playwright:v1.62.0-noble \
            npx playwright test

      - name: Upload the report and any failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
          if-no-files-found: ignore

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
