# Local development stack. `api`/`web` services are added in plan.md Phase 17 once their
# Dockerfiles exist; for now this brings up MongoDB only, matching plan.md Phase 0 task 3.
#
# MongoDB requires a replica set (even single-node) because the API uses multi-document
# transactions when publishing content (see api's PublishingService) and Mongock's change-tracking
# relies on it too. `mongo-init` runs `rs.initiate()` once and exits; `mongo` itself declares
# `--replSet rs0` from boot so the API can connect immediately once the replica set is up.
name: abofonsa

services:
  mongo:
    image: mongo:8.3
    container_name: abofonsa_mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      # Host port 27018, not the default 27017 - this machine already runs an unrelated
      # `dev_mongodb` container bound to 127.0.0.1:27017 for another project. The api service
      # inside this compose network still reaches this container at `mongo:27017` regardless.
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:8.3
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo:27017 --quiet --eval
      "try { rs.status(); print('replica set already initialized'); }
       catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); print('replica set initiated'); }"

volumes:
  mongo-data:
